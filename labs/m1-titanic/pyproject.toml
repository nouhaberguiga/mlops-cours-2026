[project]
name = "m1-titanic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dvc[s3]>=3,<4",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
m1-titanic = "m1_titanic:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
